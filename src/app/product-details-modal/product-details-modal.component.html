@if (displayVehicle(); as v) {
<div class="modal-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true" aria-labelledby="vehicle-title">
  <div class="modal-card">
    <button class="modal-close" type="button" (click)="onClose()" aria-label="Close vehicle details">
      &times;
    </button>

    <div class="details-grid">
      <div class="details-media">
        @if (v.tag) {
          <span class="vehicle-tag">{{ v.tag }}</span>
        }
        <img [src]="v.imagePath" [alt]="v.name" class="vehicle-image" />
      </div>

      <div class="details-body">
        <div class="details-header">
          <span class="vehicle-category">{{ v.category }}</span>
          <h2 id="vehicle-title" class="vehicle-name">{{ v.name }}</h2>
          <div class="vehicle-price">
            <span class="price-amount">₱{{ v.dailyRate | number }}</span>
            <span class="price-period">/ day</span>
          </div>
        </div>

        <div class="details-specs">
          <div class="spec-item">
            <span class="spec-label">Seats</span>
            <span class="spec-value">{{ v.seats }} Seats</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Transmission</span>
            <span class="spec-value">{{ v.transmission }}</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Fuel Type</span>
            <span class="spec-value">{{ v.fuel }}</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Category</span>
            <span class="spec-value">{{ v.category }}</span>
          </div>
        </div>

        <div class="details-description">
          <h3>Overview</h3>
          <p>{{ vehicleDescription() }}</p>
        </div>

        <div class="details-actions">
          <button type="button" class="button button-primary reserve-button" (click)="onReserve(v)">
            Reserve Now <app-arrow-right [size]="16" />
          </button>
          <button type="button" class="button button-secondary close-button" (click)="onClose()">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
}

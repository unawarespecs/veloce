<section class="order-form">
    <h2>Complete your reservation</h2>@if (submitted()) { <p class="order-success" role="status">Reservation received.
        API confirmation will be connected here.</p> } @else { <form [formGroup]="orderForm" (ngSubmit)="submit()">
        <label>Full name<input formControlName="name" autocomplete="name" /></label><label>Email<input type="email"
                formControlName="email" autocomplete="email" /></label><label>Pick-up date<input type="date"
                formControlName="pickup" /></label><label>Return date<input type="date"
                formControlName="returnDate" /></label><button type="submit">Request Reservation</button></form> }
</section>

<div class="menu-bar">
    <div class="desktop-links">
        <a href="#fleet">Fleet</a>
        <a href="#locations">Locations</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
    </div>
    <div class="desktop-actions">
        <a href="/sign-in">Sign In</a>
        <a href="/cart">Cart</a>
        <a class="button button-primary" href="#booking">Book Now</a>
    </div>
    <button class="menu-toggle" type="button" (click)="menuOpen.update((open) => !open)" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
    </button>
</div>
@if (menuOpen()) {
    <div class="mobile-links">
        <a href="#fleet" (click)="closeMenu()">Fleet</a>
        <a href="#locations" (click)="closeMenu()">Locations</a>
        <a href="#services" (click)="closeMenu()">Services</a>
        <a href="#about" (click)="closeMenu()">About</a>
        <a class="button button-primary" href="#booking" (click)="closeMenu()">Book Now <app-arrow-right /></a>
    </div>
}
